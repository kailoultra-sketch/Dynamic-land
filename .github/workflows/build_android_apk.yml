name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Rust JNI & Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK 34 and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Export ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Run Rust unit tests
        run: cargo test

      - name: Compile Rust library for arm64-v8a and x86_64 into jniLibs
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --lib
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libdynamic_island.so
          ls -lh android/app/src/main/jniLibs/x86_64/libdynamic_island.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and sign debug APK with Gradle assembleDebug
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK alignment and signature with zipalign and apksigner
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -v 4 "$APK_PATH"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
